<style>

      height: 100%;
      overflow: hidden;

<!-- STITCH_SVG_START:ANIMATION_34 class="fixed inset-0 w-full h-full" --><div class="fixed inset-0 w-full h-full" id="animated-svg-ANIMATION_34" style="display:block;"><svg class="w-full h-full" viewbox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<style>
    .check {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: draw 0.6s ease-out forwards 0.3s;
    }
    .circle {
      stroke-dasharray: 300;
      stroke-dashoffset: 300;
      animation: draw 0.8s ease-out forwards;
    }
    .sparkle {
      opacity: 0;
      animation: sparkle-anim 1s ease-out infinite;
    }
    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes sparkle-anim {
      0% { transform: scale(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }
  </style>
<circle class="circle" cx="50" cy="50" fill="none" r="45" stroke="#4ade80" stroke-linecap="round" stroke-width="5"></circle>

<circle class="sparkle" cx="20" cy="20" fill="#4ade80" r="2" style="animation-delay: 0.2s"></circle>
<circle class="sparkle" cx="80" cy="30" fill="#4ade80" r="3" style="animation-delay: 0.5s"></circle>
<circle class="sparkle" cx="40" cy="85" fill="#4ade80" r="2" style="animation-delay: 0.8s"></circle>
