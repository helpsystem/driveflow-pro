<!DOCTYPE html>

<html class="dark" dir="rtl" lang="fa"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>ثبت پایان جلسه آموزش</title>

                        "surface-bright": "#faf8ff",

                        "on-tertiary": "#ffffff",
                        "outline-variant": "#bdc8d1",
                        "on-secondary-fixed-variant": "#574500",
                        "on-secondary-container": "#6f5900",
                        "tertiary": "#855300",
                        "secondary": "#735c00",
                        "on-secondary-fixed": "#231b00",
                        "surface-variant": "#dae2fd",
                        "primary": "#00668a",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#fed01b",
                        "surface-tint": "#00668a",

                        "on-tertiary-fixed": "#2a1700",

                    fontFamily: {

<style>
        body { font-family: 'Vazirmatn', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .filled-icon { font-variation-settings: 'FILL' 1; }
        .glass-panel {
            background: rgba(40, 48, 68, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(189, 200, 209, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface dark:bg-inverse-surface text-on-surface dark:text-inverse-on-surface min-h-screen flex flex-col pb-24">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-inverse-surface border-b border-outline-variant dark:border-outline docked full-width top-0 sticky z-40 flat no shadows flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop h-16">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="arrow_forward">arrow_forward</span>
<h1 class="text-headline-md font-headline-md font-bold text-primary dark:text-primary-fixed-dim">ثبت پایان جلسه آموزش</h1>
</div>
<div class="flex items-center gap-4 text-primary dark:text-primary-fixed-dim">
<span class="material-symbols-outlined hover:bg-surface-container-high transition-colors p-2 rounded-full cursor-pointer" data-icon="schedule">schedule</span>
<span class="material-symbols-outlined hover:bg-surface-container-high transition-colors p-2 rounded-full cursor-pointer" data-icon="account_circle">account_circle</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile py-6 flex flex-col gap-6 max-w-2xl mx-auto w-full">
<!-- Progress Indicator -->
<div class="w-full h-3 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-secondary-container w-[90%] transition-all duration-500 rounded-full"></div>
</div>
<!-- Session Details Form -->
<section class="flex flex-col gap-5">
<div class="flex flex-col gap-2">
<label class="text-label-lg font-label-lg text-on-surface-variant dark:text-inverse-on-surface" for="studentName">نام هنرجو</label>
<input class="h-12 bg-surface-container-low dark:bg-inverse-surface border border-outline-variant rounded-lg px-4 text-body-lg font-body-lg text-on-surface dark:text-inverse-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary" id="studentName" readonly="" type="text" value="علی احمدی"/>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="text-label-lg font-label-lg text-on-surface-variant dark:text-inverse-on-surface" for="sessionNum">شماره جلسه</label>
<input class="h-12 bg-surface-container-low dark:bg-inverse-surface border border-outline-variant rounded-lg px-4 text-body-lg font-body-lg text-on-surface dark:text-inverse-on-surface text-center" id="sessionNum" readonly="" type="number" value="8"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-label-lg font-label-lg text-on-surface-variant dark:text-inverse-on-surface" for="lessonTopic">موضوع آموزش</label>
<select class="h-12 bg-surface-container-highest dark:bg-inverse-surface border border-outline-variant rounded-lg px-4 text-body-md font-body-md text-on-surface dark:text-inverse-on-surface focus:outline-none focus:border-primary-container focus:border-2" id="lessonTopic">
<option>پارک دوبل</option>
<option>دنده عقب</option>
<option>گردش به چپ و راست</option>
</select>
</div>
</div>
</section>
<!-- Live Instructor Photo -->
<section class="flex flex-col gap-2">
<label class="text-label-lg font-label-lg text-on-surface-variant dark:text-inverse-on-surface">عکس زنده مربی</label>
<div class="relative w-full aspect-video bg-surface-container-highest rounded-xl overflow-hidden border border-outline-variant flex items-center justify-center group">
<div class="absolute inset-0 bg-inverse-surface animate-pulse opacity-20"></div>
<!-- Placeholder for webcam -->
<div class="absolute inset-0 bg-cover bg-center w-full h-full opacity-60" data-alt="A cinematic, high-contrast medium shot of a driving instructor inside a car, dashboard perspective, looking directly at the camera. The lighting is moody with neon blue accents from the car's digital displays reflecting on their face. Dark cinematic tone, highly detailed, professional atmosphere." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuC6W_BenPQOEoc7R783H9vU-Sgi-fMDtlTH07Wy0tYqI2woNCO_--7mXI5luXc6qN2Td98-IS9fxM2ykeHhXY1B9TOES_2RTknrgBg139G3Pq3EIs5XCHnDBHz4Ph-2fJbvtvGaxpJkGcEvpTPrjsGJNs2mtJ48RDaY339Sgywbw9n70VAwLOMh6rhavoQU_KPzYM6TYRy-hMav8adtRa-hK0BmjnTTLB25TYJmOIfZihi1TJtO0XmmMw')"></div>
<div class="absolute top-4 right-4 flex items-center gap-2 bg-surface/80 dark:bg-inverse-surface/80 px-3 py-1 rounded-full backdrop-blur-sm border border-outline-variant/30">
<div class="w-2 h-2 rounded-full bg-error animate-ping"></div>
<span class="text-label-lg font-label-lg text-on-surface dark:text-inverse-on-surface">REC</span>
</div>
<button class="z-10 bg-primary-container/90 text-on-primary-container p-4 rounded-full backdrop-blur-md border border-primary-container hover:scale-105 transition-transform shadow-lg">
<span class="material-symbols-outlined text-headline-lg" data-icon="photo_camera">photo_camera</span>
</button>
</div>
</section>
<!-- Teacher Signature Pad -->
<section class="flex flex-col gap-2">
<label class="text-label-lg font-label-lg text-on-surface-variant dark:text-inverse-on-surface">امضای مربی</label>
<div class="relative w-full h-48 bg-surface-container-lowest rounded-xl border-2 border-dashed border-primary-container flex flex-col">
<div class="flex-1 w-full" id="signature-canvas-area">
<!-- Canvas placeholder -->
<div class="w-full h-full flex items-center justify-center opacity-30 text-on-surface-variant">
<span class="material-symbols-outlined text-display-md" data-icon="draw">draw</span>
</div>
</div>
<div class="flex justify-between items-center p-2 border-t border-outline-variant/20 bg-surface/50">
<button class="px-4 py-2 text-label-lg font-label-lg text-on-surface-variant hover:text-error transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]" data-icon="clear">clear</span> پاک کردن
                    </button>
<button class="px-4 py-2 text-label-lg font-label-lg text-primary hover:text-primary-container transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[18px]" data-icon="check">check</span> تایید امضا
                    </button>
</div>
</div>
</section>
<!-- Submit Button -->
<button class="mt-4 w-full h-14 bg-secondary-container hover:bg-secondary-fixed text-on-secondary-container rounded-xl flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-all duration-200">
<span class="text-headline-md font-headline-md font-bold">ثبت و ارسال همزمان</span>
<span class="material-symbols-outlined filled-icon" data-icon="send">send</span>
</button>
</main>
<!-- BottomNavBar (Hidden on Desktop) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full bg-surface dark:bg-inverse-surface border-t border-outline-variant shadow-lg flex justify-around items-center px-4 pb-safe h-20 z-50">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest transition-colors tap-highlight-transparent active:scale-95 w-16 h-16 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
<span class="text-label-lg font-label-lg mt-1 text-[10px]">Monitor</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 tap-highlight-transparent active:scale-95 transition-transform" href="#">
<span class="material-symbols-outlined filled-icon" data-icon="format_list_bulleted">format_list_bulleted</span>
<span class="text-label-lg font-label-lg mt-1 text-[10px]">Queue</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest transition-colors tap-highlight-transparent active:scale-95 w-16 h-16 rounded-xl" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="text-label-lg font-label-lg mt-1 text-[10px]">Settings</span>
</a>
</nav>
</body></html>
