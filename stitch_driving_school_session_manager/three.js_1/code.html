<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_35 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_35" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_35');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const video = document.querySelector('#instructor-photo-video');
const canvas = document.createElement('canvas');
const submitBtn = document.querySelector('button[type="submit"], .btn-submit');

if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
    .then(stream => {
      if (video) video.srcObject = stream;
    })
    .catch(err => console.error('Camera access error:', err));
}

if (submitBtn) {
  submitBtn.addEventListener('click', (e) => {
    // Note: In a real app, prevent default and use AJAX
    console.log('Capturing signature and selfie...');
    
    if (video) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      const selfieData = canvas.toDataURL('image/jpeg');
      console.log('Selfie captured (base64 length):', selfieData.length);
    }
  });
}

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_35 -->
</body>
</html>
