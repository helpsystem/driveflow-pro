<script>
    // Camera integration logic from requested data
    const video = document.querySelector('#instructor-photo-video');
    const canvas = document.createElement('canvas');
    const submitBtn = document.querySelector('button[type="submit"], .btn-submit');

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
        .then(stream => {
          if (video) video.srcObject = stream;
        })
        .catch(err => console.error('Camera access error:', err));
    }

    if (submitBtn) {
      submitBtn.addEventListener('click', (e) => {
        // Note: In a real app, prevent default and use AJAX
        console.log('Capturing signature and selfie...');
        
        if (video && video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          canvas.getContext('2d').drawImage(video, 0, 0);
          const selfieData = canvas.toDataURL('image/jpeg');
          console.log('Selfie captured (base64 length):', selfieData.length);
        }
      });
    }

    // Interactive Signature Pad Logic
    const sigCanvasArea = document.getElementById('signature-canvas-area');
    if (sigCanvasArea) {
        const sigCanvas = document.createElement('canvas');
        sigCanvas.className = "absolute inset-0 w-full h-full cursor-crosshair touch-none z-10";
        sigCanvasArea.appendChild(sigCanvas);
        
        const resizeCanvas = () => {
            sigCanvas.width = sigCanvasArea.clientWidth;
            sigCanvas.height = sigCanvasArea.clientHeight;
        };
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        const ctx = sigCanvas.getContext('2d');
        ctx.strokeStyle = '#00668a'; // primary color fallback
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        // Dynamic color based on dark mode could be added here, 
        // falling back to primary/on-surface-variant 
        const isDarkMode = document.documentElement.classList.contains('dark');
        ctx.strokeStyle = isDarkMode ? '#7bd0ff' : '#00668a';

        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        
        function getPos(e) {
            const rect = sigCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }
        
        function startDrawing(e) {
            isDrawing = true;
            const pos = getPos(e);
            [lastX, lastY] = [pos.x, pos.y];
        }
        
        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            [lastX, lastY] = [pos.x, pos.y];
        }
        
        function stopDrawing() {
            isDrawing = false;
        }
        
        sigCanvas.addEventListener('mousedown', startDrawing);
        sigCanvas.addEventListener('mousemove', draw);
        sigCanvas.addEventListener('mouseup', stopDrawing);
        sigCanvas.addEventListener('mouseout', stopDrawing);
        
        sigCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); }, { passive: false });
        sigCanvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
        sigCanvas.addEventListener('touchend', stopDrawing);
        
        const clearBtn = document.getElementById('clear-signature-btn');
        if (clearBtn) {
            clearBtn.addEventListener('click', () => {
                ctx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
            });
        }
    }
</script>
