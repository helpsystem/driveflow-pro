<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 140" width="100%" height="100%">
  <defs>
    <linearGradient id="plateShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="plateShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Plate Base with subtle border -->
  <rect x="2" y="2" width="276" height="136" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" filter="url(#plateShadow)"/>
  <rect x="6" y="6" width="268" height="128" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Official Red "MARYLAND" Header -->
  <text x="140" y="27" text-anchor="middle" font-family="'Barlow Semi Condensed', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="17" fill="#c8102e" letter-spacing="4">&#8226; MARYLAND &#8226;</text>

  <!-- 4 Corner Bolts -->
  <circle cx="24" cy="20" r="5" fill="url(#boltGrad)" stroke="#64748b" stroke-width="0.8"/>
  <circle cx="256" cy="20" r="5" fill="url(#boltGrad)" stroke="#64748b" stroke-width="0.8"/>
  <circle cx="24" cy="120" r="5" fill="url(#boltGrad)" stroke="#64748b" stroke-width="0.8"/>
  <circle cx="256" cy="120" r="5" fill="url(#boltGrad)" stroke="#64748b" stroke-width="0.8"/>

  <!-- Maryland State Shield in Center -->
  <g transform="translate(128, 56) scale(0.68)">
    <path d="M0,0 L36,0 L36,30 C36,48 18,60 18,60 C18,60 0,48 0,30 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <clipPath id="mdShieldClip">
      <path d="M0,0 L36,0 L36,30 C36,48 18,60 18,60 C18,60 0,48 0,30 Z"/>
    </clipPath>
    <g clip-path="url(#mdShieldClip)">
      <!-- Q1 (top-left): Calvert gold & black -->
      <rect x="0" y="0" width="18" height="26" fill="#eab308"/>
      <rect x="0" y="0" width="6" height="26" fill="#0f172a"/>
      <rect x="12" y="0" width="6" height="26" fill="#0f172a"/>
      <polygon points="0,26 18,0 18,7 4,26" fill="#0f172a"/>

      <!-- Q2 (top-right): Crossland red & white bottony cross -->
      <rect x="18" y="0" width="18" height="26" fill="#ffffff"/>
      <rect x="25" y="0" width="4" height="26" fill="#c8102e"/>
      <rect x="18" y="11" width="18" height="4" fill="#c8102e"/>
      <circle cx="27" cy="2" r="3" fill="#c8102e"/>
      <circle cx="27" cy="24" r="3" fill="#c8102e"/>
      <circle cx="20" cy="13" r="3" fill="#c8102e"/>
      <circle cx="34" cy="13" r="3" fill="#c8102e"/>

      <!-- Q3 (bottom-left): Crossland red & white bottony cross -->
      <rect x="0" y="26" width="18" height="34" fill="#ffffff"/>
      <rect x="7" y="26" width="4" height="34" fill="#c8102e"/>
      <rect x="0" y="40" width="18" height="4" fill="#c8102e"/>
      <circle cx="9" cy="52" r="3" fill="#c8102e"/>
      <circle cx="2" cy="42" r="3" fill="#c8102e"/>
      <circle cx="16" cy="42" r="3" fill="#c8102e"/>

      <!-- Q4 (bottom-right): Calvert gold & black -->
      <rect x="18" y="26" width="18" height="34" fill="#eab308"/>
      <rect x="18" y="26" width="6" height="34" fill="#0f172a"/>
      <rect x="30" y="26" width="6" height="34" fill="#0f172a"/>
      <polygon points="18,60 36,26 36,33 22,60" fill="#0f172a"/>
    </g>
  </g>

  <!-- Diagonal Glossy Shine -->
  <rect x="2" y="2" width="276" height="136" rx="14" fill="url(#plateShine)" pointer-events="none"/>
</svg>
