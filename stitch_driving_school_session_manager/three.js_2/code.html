<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_36 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_36" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_36');
  const devicePixelRatio = window.devicePixelRatio || 1;
  function updateClock() {
  const now = new Date();
  const timeEl = document.querySelector('#live-clock-time');
  const dateEl = document.querySelector('#live-clock-date');
  
  if (timeEl) {
    timeEl.innerText = now.toLocaleTimeString('fa-IR');
  }
  if (dateEl) {
    dateEl.innerText = now.toLocaleDateString('fa-IR', { 
      weekday: 'long', 
      year: 'numeric', 
      month: 'long', 
      day: 'numeric' 
    });
  }
}

setInterval(updateClock, 1000);
updateClock();

// Simulation of real-time updates
setInterval(() => {
  console.log('Fetching latest session statuses via REST API...');
}, 30000);

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_36 -->
</body>
</html>
